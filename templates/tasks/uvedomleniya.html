{% extends 'base.html' %}
{% block content %}
<h1>Уведомления</h1>

<div class="kartochka">
    <ul class="spisok-zadach">
        {% for u in spisok %}
            <li>
                <a href="{% url 'detal_zadachi' u.zadacha.pk %}">{{ u.tekst }}</a>
                <div class="meta">{{ u.data_sozdaniya }}</div>
            </li>
        {% empty %}
            <li>Уведомлений нет.</li>
        {% endfor %}
    </ul>
</div>

<a href="{% url 'dashboard' %}" class="knopka" style="background-color:#5a6672;">Назад</a>
{% endblock %}
